<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNG 切图重打包图集工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f4;
      --panel: #ffffff;
      --ink: #1f2a24;
      --muted: #64736b;
      --line: #cdd8d0;
      --accent: #287a54;
      --accent-dark: #1f6043;
      --warn: #9b5a1f;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    header {
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--line);
      background: #eef3ee;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
    }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(300px, 360px) 1fr;
      gap: 16px;
      padding: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
    }

    .stack { display: grid; gap: 12px; }

    h2 {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.3;
    }

    .dropzone {
      border: 2px dashed #9fb3a7;
      border-radius: var(--radius);
      min-height: 132px;
      display: grid;
      place-items: center;
      padding: 14px;
      text-align: center;
      background: #f9fbf8;
    }

    .dropzone strong {
      display: block;
      margin-bottom: 5px;
      font-size: 15px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    input[type="file"] { width: 100%; }

    .field {
      display: grid;
      gap: 5px;
    }

    label {
      font-size: 13px;
      color: #38473f;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      border: 1px solid #b8c7bd;
      border-radius: 6px;
      padding: 8px 9px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .check {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      line-height: 1.45;
      color: #38473f;
    }

    .check input { margin-top: 3px; }

    button {
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      padding: 11px 14px;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--accent-dark); }
    button:disabled { opacity: .52; cursor: not-allowed; }

    progress {
      width: 100%;
      height: 12px;
      accent-color: var(--accent);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      background: #fbfcfa;
      min-width: 0;
    }

    .stat strong {
      display: block;
      margin-top: 2px;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .previewWrap {
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(45deg, #dfe6e1 25%, transparent 25%),
        linear-gradient(-45deg, #dfe6e1 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #dfe6e1 75%),
        linear-gradient(-45deg, transparent 75%, #dfe6e1 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      overflow: auto;
      display: grid;
      place-items: start center;
      padding: 12px;
    }

    canvas {
      max-width: 100%;
      height: auto;
      image-rendering: auto;
      background: transparent;
      border: 1px solid rgba(0,0,0,.12);
    }

    .log {
      white-space: pre-wrap;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.45;
      max-height: 210px;
      overflow: auto;
      background: #15211a;
      color: #d7eadc;
      border-radius: 7px;
      padding: 10px;
    }

    .warn { color: var(--warn); }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <h1>PNG 切图重打包图集工具</h1>
    <p class="sub">把拆分后的 PNG 切图重新排版为图集 PNG，并导出每张切图在图集中的坐标信息。</p>
  </header>

  <div class="app">
    <aside class="stack">
      <section class="panel stack">
        <h2>导入切图</h2>
        <div class="dropzone" id="dropzone">
          <div>
            <strong>拖入 PNG 文件或 slices 文件夹</strong>
            <div class="muted">也可以使用下面的文件选择按钮。仅处理 `.png`。</div>
          </div>
        </div>
        <div class="field">
          <label for="filesInput">选择 PNG 文件</label>
          <input id="filesInput" type="file" multiple accept="image/png,.png">
        </div>
        <div class="field">
          <label for="folderInput">选择文件夹</label>
          <input id="folderInput" type="file" webkitdirectory directory multiple>
        </div>
      </section>

      <section class="panel stack">
        <h2>打包设置</h2>
        <div class="field">
          <label for="atlasNameInput">图集名称</label>
          <input id="atlasNameInput" type="text" value="atlas">
        </div>
        <div class="field">
          <label for="maxSizeInput">单张图集最大尺寸</label>
          <select id="maxSizeInput">
            <option value="2048">2048 x 2048</option>
            <option value="4096">4096 x 4096</option>
            <option value="8192" selected>8192 x 8192</option>
            <option value="16384">16384 x 16384</option>
          </select>
        </div>
        <div class="field">
          <label for="sortModeInput">图集排序</label>
          <select id="sortModeInput">
            <option value="name" selected>原图集顺序（文件名自然排序）</option>
            <option value="input">导入顺序</option>
            <option value="size">尺寸优化排序</option>
          </select>
          <div class="muted">需要和原图集排序一致时，请保持默认模式。</div>
        </div>
        <div class="field">
          <label for="paddingInput">切图间距（px）</label>
          <input id="paddingInput" type="number" min="0" max="64" step="1" value="2">
        </div>
        <div class="field">
          <label for="extrudeInput">边缘扩展（px）</label>
          <input id="extrudeInput" type="number" min="0" max="16" step="1" value="1">
          <div class="muted">把边缘像素复制到间距内，可减少采样黑边和接缝。</div>
        </div>
        <label class="check">
          <input id="trimInput" type="checkbox">
          裁掉每张切图的透明边，并在 JSON 中记录原尺寸与偏移
        </label>
        <label class="check">
          <input id="potInput" type="checkbox">
          图集尺寸使用 2 的幂
        </label>
        <label class="check">
          <input id="drawGuideInput" type="checkbox">
          预览中显示切图边框
        </label>
      </section>

      <button id="buildButton" disabled>生成图集 ZIP</button>

      <section class="panel stack">
        <h2>进度</h2>
        <progress id="progress" value="0" max="1"></progress>
        <div id="progressText" class="muted">等待导入</div>
      </section>
    </aside>

    <main class="stack">
      <section class="stats">
        <div class="stat"><span class="muted">切图数</span><strong id="imageCount">0</strong></div>
        <div class="stat"><span class="muted">原始像素</span><strong id="sourcePixels">0</strong></div>
        <div class="stat"><span class="muted">图集页数</span><strong id="pageCount">0</strong></div>
        <div class="stat"><span class="muted">预览</span><strong id="previewSize">-</strong></div>
      </section>

      <section class="panel stack">
        <h2>图集预览</h2>
        <div class="previewWrap">
          <canvas id="previewCanvas" width="1" height="1"></canvas>
        </div>
      </section>

      <section class="panel stack">
        <h2>日志</h2>
        <div id="log" class="log"></div>
      </section>
    </main>
  </div>

  <script>
    const els = {
      dropzone: document.getElementById("dropzone"),
      filesInput: document.getElementById("filesInput"),
      folderInput: document.getElementById("folderInput"),
      atlasNameInput: document.getElementById("atlasNameInput"),
      maxSizeInput: document.getElementById("maxSizeInput"),
      sortModeInput: document.getElementById("sortModeInput"),
      paddingInput: document.getElementById("paddingInput"),
      extrudeInput: document.getElementById("extrudeInput"),
      trimInput: document.getElementById("trimInput"),
      potInput: document.getElementById("potInput"),
      drawGuideInput: document.getElementById("drawGuideInput"),
      buildButton: document.getElementById("buildButton"),
      progress: document.getElementById("progress"),
      progressText: document.getElementById("progressText"),
      imageCount: document.getElementById("imageCount"),
      sourcePixels: document.getElementById("sourcePixels"),
      pageCount: document.getElementById("pageCount"),
      previewSize: document.getElementById("previewSize"),
      previewCanvas: document.getElementById("previewCanvas"),
      log: document.getElementById("log")
    };

    const state = {
      entries: [],
      lastPackage: null
    };

    function log(message, kind) {
      const prefix = kind === "warn" ? "[注意] " : kind === "error" ? "[错误] " : "";
      els.log.textContent += prefix + message + "\n";
      els.log.scrollTop = els.log.scrollHeight;
    }

    function setProgress(value, text) {
      els.progress.value = Math.max(0, Math.min(1, value || 0));
      els.progressText.textContent = text || "";
    }

    function normalizePath(value) {
      return String(value || "").replace(/\\/g, "/").replace(/^\/+/, "");
    }

    function filePath(file) {
      return normalizePath(file.webkitRelativePath || file.name);
    }

    function basename(path) {
      const normalized = normalizePath(path);
      const index = normalized.lastIndexOf("/");
      return index >= 0 ? normalized.slice(index + 1) : normalized;
    }

    function safeName(value, fallback) {
      const name = String(value || fallback || "atlas")
        .replace(/\.[^.]+$/g, "")
        .replace(/[\\/:*?"<>|]+/g, "_")
        .replace(/\s+/g, "_")
        .slice(0, 80);
      return name || fallback || "atlas";
    }

    function naturalSort(a, b) {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
    }

    function clampInt(value, min, max, fallback) {
      const n = Math.round(Number(value));
      if (!Number.isFinite(n)) return fallback;
      return Math.max(min, Math.min(max, n));
    }

    function nextPowerOfTwo(value) {
      let out = 1;
      while (out < value) out *= 2;
      return out;
    }

    async function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function loadImage(file) {
      if ("createImageBitmap" in window) {
        return await createImageBitmap(file);
      }
      return await new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("PNG 读取失败：" + file.name));
        };
        img.src = url;
      });
    }

    function findOpaqueBounds(image) {
      const canvas = document.createElement("canvas");
      canvas.width = image.width;
      canvas.height = image.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(image, 0, 0);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          if (data[(y * canvas.width + x) * 4 + 3] > 0) {
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < minX || maxY < minY) return { x: 0, y: 0, w: 1, h: 1, empty: true };
      return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1, empty: false };
    }

    async function importFiles(fileList) {
      const pngFiles = Array.from(fileList)
        .map((file, originalIndex) => ({ file, originalIndex }))
        .filter(item => /\.png$/i.test(item.file.name))
        .map(item => ({ file: item.file, path: filePath(item.file), originalIndex: item.originalIndex }))
        .sort((a, b) => naturalSort(a.path, b.path));

      const pngFilesByInput = Array.from(fileList)
        .filter(file => /\.png$/i.test(file.name))
        .map((file, originalIndex) => ({ file, path: filePath(file), originalIndex }));

      els.log.textContent = "";
      state.entries = [];
      state.lastPackage = null;
      updateStats();
      els.buildButton.disabled = true;
      setProgress(0, "正在读取 PNG");

      if (!pngFiles.length) {
        log("没有找到 PNG 文件。", "warn");
        setProgress(0, "等待导入");
        return;
      }

      const inputIndexByFile = new Map(pngFilesByInput.map(item => [item.file, item.originalIndex]));
      const seen = new Map();
      let sourcePixels = 0;
      for (let i = 0; i < pngFiles.length; i++) {
        const item = pngFiles[i];
        let key = normalizePath(item.path);
        if (seen.has(key)) {
          const count = seen.get(key) + 1;
          seen.set(key, count);
          key = key.replace(/\.png$/i, "") + "_" + count + ".png";
        } else {
          seen.set(key, 1);
        }

        const image = await loadImage(item.file);
        sourcePixels += image.width * image.height;
        state.entries.push({
          file: item.file,
          path: key,
          name: basename(key),
          originalIndex: inputIndexByFile.get(item.file) ?? i,
          image,
          width: image.width,
          height: image.height
        });
        setProgress((i + 1) / pngFiles.length, "读取 " + (i + 1) + " / " + pngFiles.length);
        if (i % 12 === 0) await sleep(0);
      }

      log("导入 PNG：" + state.entries.length + " 张");
      log("原始像素：" + sourcePixels.toLocaleString());
      els.buildButton.disabled = false;
      setProgress(0, "可以生成图集");
      updateStats();
    }

    function updateStats(packageInfo) {
      const sourcePixels = state.entries.reduce((sum, entry) => sum + entry.width * entry.height, 0);
      els.imageCount.textContent = String(state.entries.length);
      els.sourcePixels.textContent = sourcePixels.toLocaleString();
      els.pageCount.textContent = packageInfo ? String(packageInfo.pages.length) : "0";
      els.previewSize.textContent = packageInfo && packageInfo.pages.length
        ? packageInfo.pages[0].width + " x " + packageInfo.pages[0].height
        : "-";
    }

    class MaxRectsBin {
      constructor(width, height) {
        this.width = width;
        this.height = height;
        this.freeRects = [{ x: 0, y: 0, w: width, h: height }];
        this.usedRects = [];
      }

      findPosition(width, height) {
        let best = null;
        for (const rect of this.freeRects) {
          if (width > rect.w || height > rect.h) continue;
          const leftoverX = rect.w - width;
          const leftoverY = rect.h - height;
          const shortSide = Math.min(leftoverX, leftoverY);
          const longSide = Math.max(leftoverX, leftoverY);
          const score = shortSide * 100000 + longSide;
          if (!best || score < best.score || (score === best.score && rect.y < best.y)) {
            best = { x: rect.x, y: rect.y, w: width, h: height, score };
          }
        }
        return best;
      }

      insert(item) {
        const node = this.findPosition(item.packW, item.packH);
        if (!node) return null;
        this.place(node);
        return node;
      }

      place(node) {
        const next = [];
        for (const free of this.freeRects) {
          if (!intersects(free, node)) {
            next.push(free);
            continue;
          }
          if (node.x > free.x) next.push({ x: free.x, y: free.y, w: node.x - free.x, h: free.h });
          if (node.x + node.w < free.x + free.w) next.push({
            x: node.x + node.w,
            y: free.y,
            w: free.x + free.w - (node.x + node.w),
            h: free.h
          });
          if (node.y > free.y) next.push({ x: free.x, y: free.y, w: free.w, h: node.y - free.y });
          if (node.y + node.h < free.y + free.h) next.push({
            x: free.x,
            y: node.y + node.h,
            w: free.w,
            h: free.y + free.h - (node.y + node.h)
          });
        }
        this.usedRects.push(node);
        this.freeRects = pruneRects(next.filter(rect => rect.w > 0 && rect.h > 0));
      }
    }

    function intersects(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function contains(a, b) {
      return b.x >= a.x && b.y >= a.y && b.x + b.w <= a.x + a.w && b.y + b.h <= a.y + a.h;
    }

    function pruneRects(rects) {
      const out = [];
      for (let i = 0; i < rects.length; i++) {
        let contained = false;
        for (let j = 0; j < rects.length; j++) {
          if (i !== j && contains(rects[j], rects[i])) {
            contained = true;
            break;
          }
        }
        if (!contained) out.push(rects[i]);
      }
      return out;
    }

    function prepareItems(entries, options) {
      return entries.map(entry => {
        const crop = options.trim ? findOpaqueBounds(entry.image) : {
          x: 0,
          y: 0,
          w: entry.width,
          h: entry.height,
          empty: false
        };
        const width = Math.max(1, crop.w);
        const height = Math.max(1, crop.h);
        return {
          entry,
          crop,
          width,
          height,
          packW: width + options.padding * 2,
          packH: height + options.padding * 2,
          area: width * height
        };
      });
    }

    function packPages(items, options) {
      const sorted = items.slice();
      if (options.sortMode === "size") {
        sorted.sort((a, b) => b.packH - a.packH || b.packW - a.packW || naturalSort(a.entry.path, b.entry.path));
      } else if (options.sortMode === "input") {
        sorted.sort((a, b) => a.entry.originalIndex - b.entry.originalIndex || naturalSort(a.entry.path, b.entry.path));
      } else {
        sorted.sort((a, b) => naturalSort(a.entry.path, b.entry.path));
      }
      const pages = [];

      for (const item of sorted) {
        if (item.packW > options.maxSize || item.packH > options.maxSize) {
          throw new Error("切图超过最大图集尺寸：" + item.entry.path + " (" + item.packW + "x" + item.packH + ")");
        }
      }

      function makePage() {
        return { width: 1, height: 1, cursorY: 0, shelves: [], items: [] };
      }

      function placeOnPage(page, item, pageIndex) {
        let bestShelf = null;
        if (options.sortMode === "size") {
          let bestScore = Infinity;
          for (const shelf of page.shelves) {
            if (item.packH > shelf.h || shelf.x + item.packW > options.maxSize) continue;
            const remainingWidth = options.maxSize - (shelf.x + item.packW);
            const heightWaste = shelf.h - item.packH;
            const score = heightWaste * 100000 + remainingWidth;
            if (score < bestScore) {
              bestScore = score;
              bestShelf = shelf;
            }
          }
        } else {
          bestShelf = page.shelves[page.shelves.length - 1] || null;
          if (bestShelf && item.packH > bestShelf.h) {
            const extraHeight = item.packH - bestShelf.h;
            if (page.cursorY + extraHeight <= options.maxSize) {
              bestShelf.h = item.packH;
              page.cursorY += extraHeight;
            } else {
              bestShelf = null;
            }
          }
          if (bestShelf && bestShelf.x + item.packW > options.maxSize) bestShelf = null;
        }

        if (!bestShelf) {
          if (page.cursorY + item.packH > options.maxSize) return false;
          bestShelf = { x: 0, y: page.cursorY, h: item.packH };
          page.shelves.push(bestShelf);
          page.cursorY += item.packH;
        }

        item.pageIndex = pageIndex;
        item.packX = bestShelf.x;
        item.packY = bestShelf.y;
        item.x = bestShelf.x + options.padding;
        item.y = bestShelf.y + options.padding;
        bestShelf.x += item.packW;
        page.items.push(item);
        page.width = Math.max(page.width, item.packX + item.packW);
        page.height = Math.max(page.height, item.packY + item.packH);
        return true;
      }

      for (const item of sorted) {
        let placed = false;
        if (options.sortMode === "size") {
          for (let pageIndex = 0; pageIndex < pages.length; pageIndex++) {
            if (placeOnPage(pages[pageIndex], item, pageIndex)) {
              placed = true;
              break;
            }
          }
        } else if (pages.length) {
          const pageIndex = pages.length - 1;
          placed = placeOnPage(pages[pageIndex], item, pageIndex);
        }
        if (!placed) {
          const page = makePage();
          pages.push(page);
          if (!placeOnPage(page, item, pages.length - 1)) {
            throw new Error("打包失败，请增大最大图集尺寸。");
          }
        }
      }

      for (const page of pages) {
        page.width = options.powerOfTwo ? nextPowerOfTwo(page.width) : page.width;
        page.height = options.powerOfTwo ? nextPowerOfTwo(page.height) : page.height;
        page.width = Math.min(options.maxSize, page.width);
        page.height = Math.min(options.maxSize, page.height);
      }

      return pages;
    }

    function drawExtrude(ctx, image, crop, x, y, width, height, amount) {
      const ex = Math.max(0, amount | 0);
      if (!ex) return;
      const sx = crop.x;
      const sy = crop.y;
      const sw = crop.w;
      const sh = crop.h;

      ctx.drawImage(image, sx, sy, sw, 1, x, y - ex, width, ex);
      ctx.drawImage(image, sx, sy + sh - 1, sw, 1, x, y + height, width, ex);
      ctx.drawImage(image, sx, sy, 1, sh, x - ex, y, ex, height);
      ctx.drawImage(image, sx + sw - 1, sy, 1, sh, x + width, y, ex, height);

      ctx.drawImage(image, sx, sy, 1, 1, x - ex, y - ex, ex, ex);
      ctx.drawImage(image, sx + sw - 1, sy, 1, 1, x + width, y - ex, ex, ex);
      ctx.drawImage(image, sx, sy + sh - 1, 1, 1, x - ex, y + height, ex, ex);
      ctx.drawImage(image, sx + sw - 1, sy + sh - 1, 1, 1, x + width, y + height, ex, ex);
    }

    function renderPages(pages, options) {
      const canvases = [];
      for (const page of pages) {
        const canvas = document.createElement("canvas");
        canvas.width = page.width;
        canvas.height = page.height;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;

        for (const item of page.items) {
          drawExtrude(ctx, item.entry.image, item.crop, item.x, item.y, item.width, item.height, options.extrude);
          if (!item.crop.empty) {
            ctx.drawImage(
              item.entry.image,
              item.crop.x,
              item.crop.y,
              item.crop.w,
              item.crop.h,
              item.x,
              item.y,
              item.width,
              item.height
            );
          }
          if (options.drawGuide) {
            ctx.save();
            ctx.strokeStyle = "rgba(255, 0, 0, .7)";
            ctx.lineWidth = 1;
            ctx.strokeRect(item.x + .5, item.y + .5, item.width - 1, item.height - 1);
            ctx.restore();
          }
        }
        canvases.push(canvas);
      }
      return canvases;
    }

    function pageFileName(base, index, count) {
      return count === 1 ? base + ".png" : base + "_" + String(index).padStart(2, "0") + ".png";
    }

    function buildMetadata(pages, options) {
      const frames = {};
      const pageInfo = pages.map((page, index) => ({
        file: pageFileName(options.baseName, index, pages.length),
        width: page.width,
        height: page.height
      }));

      for (let pageIndex = 0; pageIndex < pages.length; pageIndex++) {
        const page = pages[pageIndex];
        for (const item of page.items) {
          frames[item.entry.path] = {
            page: pageInfo[pageIndex].file,
            frame: { x: item.x, y: item.y, w: item.width, h: item.height },
            rotated: false,
            trimmed: !!options.trim,
            spriteSourceSize: { x: item.crop.x, y: item.crop.y, w: item.width, h: item.height },
            sourceSize: { w: item.entry.width, h: item.entry.height }
          };
        }
      }

      return {
        meta: {
          app: "PNG slice atlas packer",
          version: "1.0",
          generatedAt: new Date().toISOString(),
          scale: "1",
          pages: pageInfo,
          settings: {
            maxSize: options.maxSize,
            sortMode: options.sortMode,
            padding: options.padding,
            extrude: options.extrude,
            trim: options.trim,
            powerOfTwo: options.powerOfTwo
          }
        },
        frames
      };
    }

    function buildTsv(metadata) {
      const rows = [
        ["name", "page", "x", "y", "w", "h", "sourceX", "sourceY", "sourceW", "sourceH", "originalW", "originalH"].join("\t")
      ];
      const names = Object.keys(metadata.frames).sort(naturalSort);
      for (const name of names) {
        const frame = metadata.frames[name];
        rows.push([
          name,
          frame.page,
          frame.frame.x,
          frame.frame.y,
          frame.frame.w,
          frame.frame.h,
          frame.spriteSourceSize.x,
          frame.spriteSourceSize.y,
          frame.spriteSourceSize.w,
          frame.spriteSourceSize.h,
          frame.sourceSize.w,
          frame.sourceSize.h
        ].join("\t"));
      }
      return rows.join("\r\n");
    }

    async function canvasToPngBytes(canvas) {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      if (!blob) throw new Error("PNG 编码失败。");
      return new Uint8Array(await blob.arrayBuffer());
    }

    const crcTable = (() => {
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
        table[n] = c >>> 0;
      }
      return table;
    })();

    function crc32(bytes) {
      let c = 0xffffffff;
      for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
      return (c ^ 0xffffffff) >>> 0;
    }

    function dosTimeDate(date) {
      const time = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
      const dosDate = ((date.getFullYear() - 1980) << 9) | (date.getMonth() + 1) << 5 | date.getDate();
      return { time, date: dosDate };
    }

    function writeU16(view, offset, value) { view.setUint16(offset, value, true); }
    function writeU32(view, offset, value) { view.setUint32(offset, value >>> 0, true); }

    function createZip(files) {
      const encoder = new TextEncoder();
      const now = dosTimeDate(new Date());
      const chunks = [];
      const central = [];
      let offset = 0;

      for (const file of files) {
        const nameBytes = encoder.encode(file.name);
        const data = file.data instanceof Uint8Array ? file.data : encoder.encode(String(file.data));
        const crc = crc32(data);
        const local = new Uint8Array(30 + nameBytes.length);
        const localView = new DataView(local.buffer);
        writeU32(localView, 0, 0x04034b50);
        writeU16(localView, 4, 20);
        writeU16(localView, 6, 0x0800);
        writeU16(localView, 8, 0);
        writeU16(localView, 10, now.time);
        writeU16(localView, 12, now.date);
        writeU32(localView, 14, crc);
        writeU32(localView, 18, data.length);
        writeU32(localView, 22, data.length);
        writeU16(localView, 26, nameBytes.length);
        writeU16(localView, 28, 0);
        local.set(nameBytes, 30);
        chunks.push(local, data);

        const header = new Uint8Array(46 + nameBytes.length);
        const headerView = new DataView(header.buffer);
        writeU32(headerView, 0, 0x02014b50);
        writeU16(headerView, 4, 20);
        writeU16(headerView, 6, 20);
        writeU16(headerView, 8, 0x0800);
        writeU16(headerView, 10, 0);
        writeU16(headerView, 12, now.time);
        writeU16(headerView, 14, now.date);
        writeU32(headerView, 16, crc);
        writeU32(headerView, 20, data.length);
        writeU32(headerView, 24, data.length);
        writeU16(headerView, 28, nameBytes.length);
        writeU16(headerView, 30, 0);
        writeU16(headerView, 32, 0);
        writeU16(headerView, 34, 0);
        writeU16(headerView, 36, 0);
        writeU32(headerView, 38, 0);
        writeU32(headerView, 42, offset);
        header.set(nameBytes, 46);
        central.push(header);
        offset += local.length + data.length;
      }

      const centralOffset = offset;
      let centralSize = 0;
      for (const item of central) centralSize += item.length;
      chunks.push(...central);
      offset += centralSize;

      const end = new Uint8Array(22);
      const endView = new DataView(end.buffer);
      writeU32(endView, 0, 0x06054b50);
      writeU16(endView, 4, 0);
      writeU16(endView, 6, 0);
      writeU16(endView, 8, files.length);
      writeU16(endView, 10, files.length);
      writeU32(endView, 12, centralSize);
      writeU32(endView, 16, centralOffset);
      writeU16(endView, 20, 0);
      chunks.push(end);
      return new Blob(chunks, { type: "application/zip" });
    }

    function downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    async function buildAtlas() {
      if (!state.entries.length) return;
      els.buildButton.disabled = true;
      try {
        const options = {
          baseName: safeName(els.atlasNameInput.value, "atlas"),
          maxSize: clampInt(els.maxSizeInput.value, 256, 16384, 8192),
          sortMode: els.sortModeInput.value,
          padding: clampInt(els.paddingInput.value, 0, 64, 2),
          extrude: clampInt(els.extrudeInput.value, 0, 16, 1),
          trim: els.trimInput.checked,
          powerOfTwo: els.potInput.checked,
          drawGuide: els.drawGuideInput.checked
        };
        options.extrude = Math.min(options.extrude, options.padding);

        setProgress(0.05, "正在准备切图");
        log("开始打包：" + state.entries.length + " 张 PNG");
        const items = prepareItems(state.entries, options);
        await sleep(0);

        setProgress(0.2, "正在排版图集");
        const pages = packPages(items, options);
        log("图集页数：" + pages.length);
        for (let i = 0; i < pages.length; i++) {
          log("页面 " + (i + 1) + "：" + pages[i].width + "x" + pages[i].height + "，切图 " + pages[i].items.length + " 张");
        }

        setProgress(0.45, "正在绘制图集");
        const canvases = renderPages(pages, options);
        previewCanvas(canvases[0]);
        updateStats({ pages });
        await sleep(0);

        const metadata = buildMetadata(pages, options);
        const encoder = new TextEncoder();
        const files = [
          { name: options.baseName + ".json", data: encoder.encode(JSON.stringify(metadata, null, 2)) },
          { name: options.baseName + ".tsv", data: encoder.encode(buildTsv(metadata)) },
          { name: "README.txt", data: encoder.encode([
            "PNG atlas package",
            "",
            "PNG files are packed without rotation.",
            "atlas.json records page, x, y, width, height, original size and trim offset.",
            "atlas.tsv contains the same mapping in a spreadsheet-friendly format."
          ].join("\r\n")) }
        ];

        for (let i = 0; i < canvases.length; i++) {
          setProgress(0.55 + 0.35 * ((i + 1) / canvases.length), "正在编码 PNG " + (i + 1) + " / " + canvases.length);
          files.push({
            name: pageFileName(options.baseName, i, canvases.length),
            data: await canvasToPngBytes(canvases[i])
          });
        }

        setProgress(0.95, "正在打包 ZIP");
        const zip = createZip(files);
        const zipName = options.baseName + "_png_atlas.zip";
        downloadBlob(zip, zipName);
        state.lastPackage = { pages, metadata };
        log("完成：" + zipName);
        setProgress(1, "已生成 ZIP");
      } catch (error) {
        log(error.message || String(error), "error");
        setProgress(0, "生成失败");
      } finally {
        els.buildButton.disabled = !state.entries.length;
      }
    }

    function previewCanvas(source) {
      const canvas = els.previewCanvas;
      canvas.width = source.width;
      canvas.height = source.height;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(source, 0, 0);
    }

    els.filesInput.addEventListener("change", event => {
      importFiles(event.target.files).catch(error => {
        log(error.message || String(error), "error");
        setProgress(0, "导入失败");
      });
    });

    els.folderInput.addEventListener("change", event => {
      importFiles(event.target.files).catch(error => {
        log(error.message || String(error), "error");
        setProgress(0, "导入失败");
      });
    });

    els.dropzone.addEventListener("dragover", event => {
      event.preventDefault();
      els.dropzone.style.borderColor = "var(--accent)";
    });

    els.dropzone.addEventListener("dragleave", () => {
      els.dropzone.style.borderColor = "#9fb3a7";
    });

    els.dropzone.addEventListener("drop", event => {
      event.preventDefault();
      els.dropzone.style.borderColor = "#9fb3a7";
      importFiles(event.dataTransfer.files).catch(error => {
        log(error.message || String(error), "error");
        setProgress(0, "导入失败");
      });
    });

    els.buildButton.addEventListener("click", () => {
      buildAtlas();
    });
  </script>
</body>
</html>
